name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q SmoothLauncher*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease
        working-directory: SmoothLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: SmoothLauncher-apk
          path: SmoothLauncher/app/build/outputs/apk/release/app-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: SmoothLauncher/app/build/outputs/apk/release/app-release.apk
